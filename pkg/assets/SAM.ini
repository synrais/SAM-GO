; ===================================================================
; SAM.ini - Configuration file for SAM
; ===================================================================
; COMMAND CHEAT SHEET  (run over SSH, or from any script)
; -------------------------------------------------------------------
;   /media/fat/Scripts/gamesmenu.sh <option>
;
;   (no option)          open the games menu
;
;   Attract mode
;   -attract             start attract mode (its log on screen)
;   -attract -bg         start it in the background
;                        (log: /tmp/gamesmenu_attract.log)
;   -attract Nintendo    only these systems or groups, this run
;                        (e.g. -attract SNES,Console)
;   -status              is it running, and what's playing?
;   -next / -back        next or previous game
;   -play                stop the show, keep playing this game
;   -stay                stay on this game (again to carry on)
;   -blacklist           never play this game again, next game
;   -stop                stop attract mode, back to the MiSTer menu
;   -menu                open the games menu on the TV (closes the game)
;   -search              ...straight into its Search screen
;   -find mario 3        attract mode plays the games matching all the
;                        words first, then carries on as normal
;                        (the same as pressing ` once and typing)
;
;   Games
;   -launch <file>       launch a game, e.g.
;                        -launch /media/fat/games/NES/Tetris.nes
;   -random              launch a random game
;   -random Nintendo     ...from these systems or groups
;   -list                print every game in the database
;   -rebuild             rebuild the games database (no screens)
;
;   Music player
;   -music start / stop  start or stop the background music
;   -music next          next track
;   -music status        what's playing
;
;   Testing
;   -inputs              print every key, click and controller press
;   -press start         press buttons on the virtual pad
;                        (a b x y l r select start home up down left
;                        right, key:enter..., numbers = pauses)
;   -watch               live static detector status
;
;   -launch and -random end a running attract mode first; the other
;   options never disturb a running menu or attract mode.
; ===================================================================
; Valid System IDs (from systems.go):
;
; === Console Systems ===
; 3DO, AdventureVision, AmigaCD32, AmigaCDTV, Arcadia, Astrocade,
; Atari2600, Atari5200, Atari7800, CasioPV1000, CDI, ChannelF,
; ColecoVision, CreatiVision, FDS, Intellivision, Jaguar, JaguarCD,
; MasterSystem, MegaCD, MegaDrive, NeoGeo, NeoGeoCD, NES, Nintendo64,
; Odyssey2, PSX, Saturn, Sega32X, SG1000, SNES, SuperGameboy, SuperGrafx,
; TurboGrafx16, TurboGrafx16CD, VC4000, Vectrex, VirtualBoy
;
; === Handheld Systems ===
; AtariLynx, Gamate, GameAndWatch, Gameboy, Gameboy2P, GameboyColor,
; GameGear, GBA, GBA2P, MegaDuck, NeoGeoPocket, NeoGeoPocket-Color,
; PocketChallengeV2, PokemonMini, SuperVision, WonderSwan, WonderSwanColor
;
; === Computer Systems ===
; AcornAtom, AcornElectron, AliceMC10, Amiga, AmigaVision, Amstrad,
; AmstradPCW, ao486, Apogee, AppleI, AppleII, Aquarius, Atari800, BBCMicro,
; BK0011M, C16, C64, CasioPV2000, CoCo2, EDSAC, Galaksija, Interact,
; Jupiter, Laser, Lynx48, MacPlus, MSX, MSX1, MultiComp, Orao, Oric, PCXT,
; PDP1, PET2001, PMD85, QL, RX78, SAMCoupe, SordM5, Specialist, SVI328,
; TatungEinstein, TI994A, TomyTutor, TRS80, TSConf, UK101, Vector06C,
; VIC20, X68000, ZX81, ZXNext, ZXSpectrum
;
; === Arcade Systems ===
; Arcade
;
; === Other Systems ===
; Arduboy, Chip8, Groovy, NESMusic, SNESMusic
;
; === Groups ===
; Anywhere a system ID is accepted, a group can be used too:
;   Categories:    Console, Handheld, Computer, Arcade, Other
;   Manufacturers: Acorn, Amstrad, Apogee, Apple, Atari, Bally, Bandai,
;                  Benesse, Bit Corporation, Cambridge, Casio, Coleco,
;                  Commodore, Compukit, DEC, Elektronika, Emerson, Entex,
;                  Fairchild, GCE, IBM, Interact, Interton, Jupiter,
;                  Magnavox, Mattel, Microsoft, Miles Gordon Technology,
;                  MiSTer, NEC, Nintendo, Panasonic, PEL Varazdin, Philips,
;                  Sega, Sharp, Sinclair, SNK, Sony, Sord, SpecNext,
;                  Spectravideo, Tandy, Tangerine, Tatung, Tesla,
;                  Texas Instruments, Tomy, Video Technology, VTech, Watara
; ===================================================================

; ========================
; Games Folders & Cores
; ========================
[Systems]
; Extra places laid out like a "games" folder, with a folder per system
; inside (e.g. /media/usb0/MoreGames/SNES). One line each, e.g.
; games_folder = /media/usb0/MoreGames
;
; An extra folder for one system, used as-is (no system subfolder needed).
; Format is SystemID:/path, one line each, e.g.
; system_folder = SNES:/media/usb0/SNES Hacks
; system_folder = PSX:/media/usb1/PSX Redump
;
; Use a different core for a system. Format is SystemID:core, e.g.
; set_core = SNES:_Console/SNES_alt

; ========================
; Games Database
; ========================
; Leaves games out of the games database entirely: they won't appear in
; the games menu, search or attract mode.
; Rebuild the games database after changing anything here.
[Database]
; Systems or groups to leave out completely, comma separated
; (e.g. Computer, NESMusic, SNESMusic)
Exclude =

; ------------------------
; Folder, file & extension rules
; ------------------------
; Sections named [Database.X] leave out only some games, where X is ALL,
; a system ID or a group (e.g. [Database.SNES], [Database.Nintendo]).
; [Attract.X] sections (further down) work exactly the same way.
;
;   Folders    = folder names inside a system (not the file name)
;   Files      = file names; the extension is optional, so "tetris"
;                also matches "tetris.nes" and "tetris.smc"
;   Extensions = with or without the dot (e.g. "nes" or ".nes")
;   Paths      = a location and everything under it (e.g. /media/usb1)
;
; Matching ignores case:
;   hack    exactly "hack"
;   hack*   starts with "hack"
;   *hack   ends with "hack"
;   *hack*  contains "hack"
;
; Examples:
;   [Database.ALL]
;   Files      = *(Proto)*, *(Beta)*
;   Paths      = /media/usb1
;
;   [Database.SNES]
;   Folders    = Hacks
;   Extensions = bs
;
; Leave fields empty if not used.
[Database.ALL]
Folders    =
Files      =
Extensions =
Paths      =

; ========================
; Game Lists
; ========================
; Per-system game lists used by attract mode. They live in the Lists
; folder next to this file, one file per system, e.g.
;   Lists/Blacklist/SNES_blacklist.txt
;   Lists/Staticlist/SNES_staticlist.txt
;   Lists/Whitelist/SNES_whitelist.txt
; One game title per line (with or without its file extension). Lines
; starting with # or ; are ignored. Titles are matched ignoring case and
; punctuation.
;
; Each list has Use (true/false) plus Include and Exclude, which take
; system IDs and groups like everywhere else (leave Include blank for all).
[List]
; rescan all files each session into ram,
; will not build visable lists, avoids SD writes.
; Slower than using normal lists but always fresh.
RamOnly = false

; Blacklist: games attract mode never plays. The static detector adds
; games that sit on a black screen (see [StaticDetector]).
UseBlacklist = true
BlacklistInclude =
BlacklistExclude =

; Staticlist: remembers the point where each game stops moving (e.g. it
; reaches a still title screen). The static detector writes it for you,
; one line per game with the time in seconds, e.g. "<42> Game Name"
; means the screen froze 42 seconds in.
; Attract mode then moves on to the next game SkipafterStatic seconds
; after that point, instead of sitting on a frozen screen until its
; PlayTime runs out. Example: frozen at 42s + SkipafterStatic 10 = the
; game plays for 52 seconds (or less, if PlayTime is shorter).
UseStaticlist = true
StaticlistInclude =
StaticlistExclude =
SkipafterStatic = 10

; Whitelist: a list you make yourself. For a system that has a whitelist
; file, attract mode only plays the games on it.
UseWhitelist = false
WhitelistInclude =
WhitelistExclude =

; ========================
; Attract Mode Settings
; ========================
[Attract]
; Seconds each game is played
; Can be a single number (e.g. 40)
; Or a range (e.g. 40-130) to randomize between min and max
PlayTime = 45-60

; Randomize selection order (true/false)
Random = true

; Systems or groups to include or exclude from Attract mode, comma
; separated (see the lists at the top). Leave Include blank for all.
; Include narrows the pool, then Exclude removes from it (Exclude wins), e.g.
;   Include = Console, AmigaVision
;   Exclude = Nintendo, MegaCD
Include =
Exclude =

; Enable static detector during Attract mode (true/false)
; (see [StaticDetector] below)
UseStaticDetector = true

; "Other buttons" in the menu: what a key or button with no action does
; while attract mode plays (actions are set in the [InputDetector.X]
; sections below, or Options -> Controls):
; Ignore (do nothing), Play (play the game) or Stop (back to menu)
OtherInput = Play

; "Restart if idle" in the menu: after you choose to play a game, attract
; mode starts again if nothing is pressed for this many minutes
; (0 = off: playing a game ends attract mode for good)
IdleRestart = 0

; Leave some games out of attract mode only (they still appear in the
; games menu and search). Same rules as [Database.X] above: use
; [Attract.ALL], a system ID or a group (e.g. [Attract.NES]).
; Takes effect straight away, no rebuild needed.
[Attract.ALL]
Folders    =
Files      =
Extensions =
Paths      =

; ========================
; Music Player
; ========================
; Background music from /media/fat/music (MP3 and OGG), also in the menu:
; Options -> Music Player. Each folder inside the music folder is a
; playlist.
[Music]
; Random or In order
Playback = Random
; Empty = the music folder itself, All = every folder, or a folder name
Playlist =
; Pause while a game plays (MiSTer mixes this music into every core's
; sound), carrying on in the MiSTer menu (true/false)
PauseInGames = true

; ========================
; Startup
; ========================
; What starts when the MiSTer boots. Set from the menu (Options -> Attract
; Mode -> On startup, and Options -> Music Player): the menu then writes
; a marked block into /media/fat/linux/user-startup.sh, leaving the rest
; of that file alone. Changing these lines by hand needs the menu to
; save once to take effect.
[Startup]
; Nothing, Games menu or Attract mode (only one: both want the screen)
Start = Nothing
; Start the music player (true/false)
Music = false

; ========================
; BIOS Skip
; ========================
; Button presses after a game loads, to get past BIOS screens. SAM plugs
; in a virtual pad before the game loads, presses the sequence, then
; unplugs it. The switches are also in Options -> Controls.
[BiosSkip]
; After attract mode launches a game (true/false)
Attract = true
; After you launch a game from the games menu (true/false)
Menu = true

; Per system, [BiosSkip.<system ID>] Sequence = what to press, in order:
;   a number    pause for that many seconds (start with one: the game
;               needs time to load)
;   a b x y l r select start home up down left right
;               virtual pad buttons (MiSTer's default map)
;   key:enter, key:space, key:f1 ...
;               keyboard keys (only for cores that read a keyboard)
; Test a sequence on a running game with: gamesmenu.sh -press start
[BiosSkip.FDS]
Sequence = 10, a

; ========================
; Input Detection Settings
; ========================
; Watches keyboards, mice and controllers while attract mode runs. Turn
; each kind on or off here; what each input does is set in the sections
; below (or from the games menu: Options -> Controls).
;
; To see an input's name, run the input test, which prints every press
; (e.g. "joystick (8BitDo Pro 2): dpleft"):
;   /media/fat/Scripts/gamesmenu.sh -inputs
; Controllers the SDL controller database doesn't know use raw names
; like btn0, axis0+ (d-pads are still dpup, dpdown, dpleft, dpright).
[InputDetector]
Mouse = true
Keyboard = true
Joystick = true

; Attract mode controls, as input = action. Actions:
;   next       next game: forward through the history if you went back,
;              otherwise a new random game (as when the play time ends)
;   back       previous game in the history (the last 100 are kept)
;   play       stop attract mode and keep playing this game
;   stop       stop attract mode and go back to the menu
;   blacklist  never play this game in attract mode again, next game
;   stay       stay on this game (no timer, no skipping); again to resume
;   menu       close the game and open the games menu on the TV
;   search     press once: type a search on the keyboard (no screen; Enter
;              plays the games it finds first, Esc cancels). Press twice
;              quickly: close the game and open the games menu on the TV
; Leave an input empty (or remove it) for no action.
[InputDetector.Mouse]
left  = back
right = next

[InputDetector.Keyboard]
left   = back
right  = next
enter  = play
esc    = stop
delete = blacklist
space  = stay
"`"    = search

[InputDetector.Joystick]
dpleft   = back
dpright  = next
leftx-   = back
leftx+   = next
start    = play
back     = stop
; digital buttons
a         =
b         =
x         =
y         =
guide     =
touchpad  =
leftshoulder  =
rightshoulder =
leftstick     =
rightstick    =
dpup      =
dpdown    =
misc1     =
misc2     =
paddle1   =
paddle2   =
paddle3   =
paddle4   =
; analog triggers
lefttrigger-  =
lefttrigger+  =
righttrigger- =
righttrigger+ =
; analog sticks
lefty-   =
lefty+   =
rightx-  =
rightx+  =
righty-  =
righty+  =

; ========================
; Games Menu Controls
; ========================
; Games menu controls. A controller works in the menu because MiSTer
; turns its buttons into keys: A = enter, B = esc, X = space, Y = tab,
; L/R = page up/down. Y opens Search and X opens Options (fixed).
; Set from the menu: Options -> Controls -> Menu Layout.
;
; Layout: Western (A confirms, B backs out) or Japanese (B confirms,
; A backs out). Japanese swaps Enter and Esc, on a keyboard too.
[Controls.Menu]
Layout = Western

; ========================
; Static Detector Settings
; ========================
; Watches the screen while attract mode plays a game (turn it on with
; UseStaticDetector in [Attract]). After the Grace period, a screen that
; stays black or unchanged too long can add the game to its Blacklist or
; Staticlist (see [List]) and skip to the next game. Times are seconds.
; To watch what the detector sees while attract mode runs, from a PC:
;   ssh -t root@<mister-ip> "watch -n 0.1 cat /tmp/SAM_detector"
[StaticDetector]
;Time the screen must be black
BlackThreshold = 30
;Time the screen must be static
StaticThreshold = 30

;Skip games with black screens
SkipBlack = true
;Update and maintain Black lists
WriteBlackList = true

;Skip games with static screens
SkipStatic = true
;Update and maintain Static lists
WriteStaticList = true
;Grace period before counting a screen as static
Grace = 25
; What counts as moving. The screen is split into a 16x12 grid (192
; cells), and it counts as moving only if at least MinSpread cells changed
; in the last SpreadTime seconds. So change stuck in one spot counts as
; static, however big it is, and small sprites that travel around count
; as moving, however small they are. Measured on test screens (5s window):
;   flashing cursor 1 cell, blinking "PRESS START" 6, slow walking
;   sprite 10-20, Pong ball 19-26, Pac-Man-style ghosts 58-67,
;   scrolling 192.
; Raise MinSpread to skip more "nearly still" screens, lower it if slow,
; simple games get skipped by mistake (e.g. per system:
; [StaticDetector.Atari2600]). 1 = any change at all counts as moving.
MinSpread = 8
SpreadTime = 5

; Overrides for a system or a group, e.g. [StaticDetector.PSX] or
; [StaticDetector.Computer]. Only the settings you list are changed; a
; system's own section wins over a group's.
[StaticDetector.PSX]
Grace = 30

; ========================
; Games Menu Settings
; ========================
; How the games menu shows each system, e.g. "[Nintendo] NES".
; These are saved automatically when you change them in the menu under
; Options -> Display & Sorting -> Menu list options, but can also be edited here.
[Menu]
; Where lines sit in the list: Left, Center or Right
LabelAlign = Left
; Between manufacturer and system: Space, Dash, Colon, Pipe or Arrow
LabelDivider = Space
; Line up the dividers in one column (true/false)
LabelAlignDivider = false
; Around the manufacturer: None, [ ], ( ), < >, { },
; [ spaced ], ( spaced ), < spaced > or { spaced }
LabelEncapsulate = [ ]
; Text size on the MiSTer's own screen: Auto, Normal, Large, Extra large
; or Huge. The menu sets it while open and restores it on exit, so fb_size
; in MiSTer.ini can stay as it is. Auto picks the biggest text that still
; leaves at least a 60x20 grid (on a 1080p TV that's Huge).
TextSize = Auto
; Open where you left off (the folder and line you were on when you last
; launched a game or exited), true/false. If that spot is gone, it opens
; as close to it as it can.
RememberPosition = false
; Show the manufacturer at all (true/false). Off shows just the system's
; full name, e.g. "Atari 2600".
ShowManufacturer = true

; ---- Systems list sorting (Options -> Display & Sorting -> Systems list sorting) ----
; Up to two levels of groups, then the systems inside them, e.g. by
; category (custom order), then manufacturer A-Z, then release date.
; First group by: Manufacturer, Category or None
SystemGroup = Category
; Order of those groups: A-Z, Oldest first (by each group's earliest
; system) or Custom (Category only, uses CategoryOrder)
SystemGroupOrder = Custom
; Custom category order, comma separated. Categories left out go last.
CategoryOrder = Arcade, Console, Handheld, Computer, Other
; Then group by (inside the first groups, always A-Z): Manufacturer,
; Category or None
SystemSubgroup = Manufacturer
; Show the first-level groups as one List, or as Folders you open (the
; Arcade Cores stay on the top screen when ArcadeFirst is on)
GroupView = Folders
; With List, a heading above each first-level group: Off, Line, Double, Brackets,
; Dots or Minimal, e.g. Brackets: =====[  COMPUTERS  ]=====
GroupHeaders = Off
; Order of the systems inside the groups: Release date or A-Z
SystemOrder = Release date
; Always put the Arcade Cores at the top of the list (true/false)
ArcadeFirst = false

; ---- Game list sorting (Options -> Display & Sorting -> Game list sorting) ----
; Also used for search results.
; Where folders go: First, Last or Mixed (in with the games)
FolderPosition = First
; Alphabetical, or Natural (numbers by value: "Game 2" before "Game 10")
GameOrder = Natural
; Sort "The Legend of Zelda" under L (true/false)
IgnoreThe = false
; Hide file extensions in game lists and search results (true/false)
HideExtensions = false
; Put multi-disc games ("(Disc 1)", "(Disc 2)"...) in a folder of their
; own, listed in with the games (true/false). Also in A-Z folders.
GroupDiscs = false

; ---- Virtual A-Z Folders (Options -> Display & Sorting) ----
; Systems that get a [Games A-Z] folder at the top, listing every game from
; all their folders once, A-Z. Handy for big sets sorted into genres (e.g.
; PlayStation) without keeping a second copy. Only systems with subfolders
; get one. System IDs or groups, comma separated (e.g. PSX, Saturn).
VirtualAZFolders =
